<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <!-- Gradiente moderno inspirado no Element Plus / Element UI -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#409EFF" />
      <stop offset="100%" stop-color="#2b7de9" />
    </linearGradient>
  </defs>

  <!-- SÍMBOLO / ÍCONE -->
  <g transform="translate(10, 10)">
    <!-- Fundo do ícone com cantos arredondados -->
    <rect width="60" height="60" rx="14" fill="url(#primaryGrad)" />
    
    <!-- Elementos geométricos internos (Representando movimento/estratégia) -->
    <path d="M18 30 L30 18 L42 30 L30 42 Z" fill="#ffffff" opacity="0.2" />
    <!-- Seta centralizada ou bloco de movimento -->
    <path d="M22 34 L30 26 L38 34 M30 26 L30 46" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- TEXTO DA MARCA -->
  <text x="85" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#303133" letter-spacing="-0.5">
    Best<tspan fill="#409EFF" font-weight="600">Move</tspan>
  </text>
</svg>
